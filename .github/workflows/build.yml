name: Build HATIM 5G APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev \
            libssl-dev cmake \
            libltdl-dev build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36 requests

      - name: Check project files
        run: |
          test -f main.py
          test -f buildozer.spec
          echo "Project files found."

      - name: Download licensed Arabic font
        run: |
          mkdir -p assets/fonts
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/google/fonts/35ddfc50b8c0dda6a1e0eb5d48d962c26a2ec5ff/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf \
            --output assets/fonts/NotoNaskhArabic.ttf
          test "$(git hash-object assets/fonts/NotoNaskhArabic.ttf)" = "a8d2867262dc7bb28492ad746de5d56235735c8b"
          test -s assets/fonts/NotoNaskhArabic.ttf
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/google/fonts/35ddfc50b8c0dda6a1e0eb5d48d962c26a2ec5ff/ofl/notonaskharabic/OFL.txt \
            --output assets/fonts/OFL.txt
          test -s assets/fonts/OFL.txt

      - name: Run parser and router tests
        run: python -m unittest discover -s tests -v

      - name: Build debug APK
        env:
          P4A_RELEASE: "0"
        run: |
          yes | buildozer android debug

      - name: Stage APK for download
        id: stage_apk
        run: |
          mkdir -p dist
          apk="$(find . -type f -name '*.apk' \
            -not -path './.git/*' \
            -not -path './dist/*' \
            -print -quit)"
          if [ -z "$apk" ]; then
            echo "No APK was found anywhere in the workspace after Buildozer completed."
            find . -type f \( -name '*.apk' -o -name '*.aab' \) -print
            exit 1
          fi
          echo "Found APK: $apk"
          cp "$apk" dist/HATIM5G-debug.apk
          test -s dist/HATIM5G-debug.apk

      - name: Verify Arabic font in packaged app data
        run: |
          if ! unzip -p dist/HATIM5G-debug.apk assets/private.tar > dist/private.tar; then
            echo "Could not extract assets/private.tar from the APK."
            exit 1
          fi
          if [ ! -s dist/private.tar ]; then
            echo "APK does not contain a non-empty assets/private.tar."
            exit 1
          fi
          if ! tar -tzf dist/private.tar > dist/app-contents.txt; then
            echo "Could not read the packaged app data archive."
            exit 1
          fi
          if ! grep -Fq 'assets/fonts/NotoNaskhArabic.ttf' dist/app-contents.txt; then
            echo "Arabic font is missing from assets/private.tar. Packaged font files:"
            grep -Ei '\.ttf$|NotoNaskh' dist/app-contents.txt || true
            exit 1
          fi

      - name: Upload APK
        if: always() && steps.stage_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: HATIM5G-debug-apk
          path: dist/HATIM5G-debug.apk
          if-no-files-found: error
          retention-days: 7
