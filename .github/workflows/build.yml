name: Build HATIM 5G APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             git zip unzip             autoconf automake libtool pkg-config             zlib1g-dev libncurses-dev libffi-dev             libssl-dev cmake             libltdl-dev build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36 requests

      - name: Check project files
        run: |
          test -f main.py
          test -f buildozer.spec
          echo "Project files found."

      - name: Download licensed Arabic font
        run: |
          mkdir -p assets/fonts
          curl --fail --location --silent --show-error             https://raw.githubusercontent.com/google/fonts/35ddfc50b8c0dda6a1e0eb5d48d962c26a2ec5ff/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf             --output assets/fonts/NotoNaskhArabic.ttf
          test "$(git hash-object assets/fonts/NotoNaskhArabic.ttf)" = "a8d2867262dc7bb28492ad746de5d56235735c8b"
          test -s assets/fonts/NotoNaskhArabic.ttf
          curl --fail --location --silent --show-error             https://raw.githubusercontent.com/google/fonts/35ddfc50b8c0dda6a1e0eb5d48d962c26a2ec5ff/ofl/notonaskharabic/OFL.txt             --output assets/fonts/OFL.txt
          test -s assets/fonts/OFL.txt

      - name: Run parser and router tests
        run: python -m unittest discover -s tests -v

      - name: Build debug APK
        env:
          P4A_RELEASE: "0"
        run: |
          yes | buildozer android debug

      - name: Verify Arabic font is packaged
        run: |
          apk="$(find bin -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          unzip -l "$apk" | grep -q 'NotoNaskhArabic.ttf'

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HATIM5G-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
